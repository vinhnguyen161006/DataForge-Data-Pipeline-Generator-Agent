name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.10"
  NODE_VERSION: "22.19.0"

jobs:
  conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/check_conventions.py

  backend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run --locked ruff format --check . ../airflow ../scripts
      - run: uv run --locked ruff check . ../airflow ../scripts
      - run: uv run --locked mypy app worker tests ../scripts/check_conventions.py

  backend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge
          POSTGRES_DB: dataforge_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataforge -d dataforge_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATAFORGE_APP_DATABASE_URL: postgresql+asyncpg://dataforge:dataforge@localhost:5432/dataforge_app
      DATAFORGE_CHECKPOINT_DATABASE_URL: postgresql://dataforge:dataforge@localhost:5432/dataforge_app
      DATAFORGE_TEST_DATABASE_URL: postgresql+asyncpg://dataforge:dataforge@localhost:5432/dataforge_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Apply migrations to an empty database
        run: uv run --locked alembic upgrade head
      - name: Fail when models and migrations drift
        run: uv run --locked alembic check
      - name: Create LangGraph checkpoint tables
        run: uv run --locked python -m app.db.checkpointer
      - name: Checkpointer tables stay invisible to Alembic
        run: uv run --locked alembic check
      - run: uv run --locked pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run ci

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build airflow image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: airflow
          push: false
          load: true
          tags: dataforge-airflow:ci
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max
      - name: dbt runs from its isolated virtualenv
        run: docker run --rm --entrypoint /opt/dbt-venv/bin/dbt dataforge-airflow:ci --version
      - name: DAG file imports inside the Airflow image
        run: >-
          docker run --rm --entrypoint python
          -v "$PWD/airflow/dags:/opt/airflow/dags:ro"
          dataforge-airflow:ci
          -c "import runpy; runpy.run_path('/opt/airflow/dags/dataforge_pipelines.py')"

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Audit backend dependencies
        working-directory: backend
        run: uv sync --locked && uv run --locked pip-audit
      - name: Audit isolated dbt dependencies
        working-directory: backend
        run: uv run --locked pip-audit --no-deps --disable-pip -r ../airflow/dbt/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit frontend runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
