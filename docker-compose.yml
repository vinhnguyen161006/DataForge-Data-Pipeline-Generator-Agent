name: dataforge

x-backend-image: &backend-image
  build: ./backend
  image: dataforge-backend:0.1.0

x-app-db: &app-db
  DATAFORGE_APP_DATABASE_URL: postgresql+asyncpg://dataforge:${DATAFORGE_APP_PASSWORD}@postgres:5432/dataforge_app
  DATAFORGE_STORAGE_ROOT: /data

x-after-migrate: &after-migrate
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

x-airflow: &airflow
  build: ./airflow
  image: dataforge-airflow:0.1.0
  environment: *airflow-env
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - dataforge-data:/data
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATAFORGE_APP_PASSWORD: ${DATAFORGE_APP_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD}
      PUBLISHER_PASSWORD: ${PUBLISHER_PASSWORD}
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5432:5432"
    networks:
      - default
      - sandbox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"

  metabase:
    image: metabase/metabase:v0.63.18.4
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *backend-image
    command: sh -c "alembic upgrade head && python -m app.db.checkpointer"
    environment:
      <<: *app-db
      DATAFORGE_CHECKPOINT_DATABASE_URL: postgresql://dataforge:${DATAFORGE_APP_PASSWORD}@postgres:5432/dataforge_app
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-image
    environment:
      <<: *app-db
      DATAFORGE_CHECKPOINT_DATABASE_URL: postgresql://dataforge:${DATAFORGE_APP_PASSWORD}@postgres:5432/dataforge_app
      DATAFORGE_JWT_SECRET: ${DATAFORGE_JWT_SECRET}
      DATAFORGE_GEMINI_API_KEY: ${DATAFORGE_GEMINI_API_KEY}
      DATAFORGE_QDRANT_URL: http://qdrant:6333
      DATAFORGE_GITHUB_TOKEN: ${DATAFORGE_GITHUB_TOKEN}
    volumes:
      - dataforge-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      retries: 10
    depends_on:
      <<: *after-migrate
      qdrant:
        condition: service_started

  sandbox-worker:
    <<: *backend-image
    command: python -m worker.main
    environment:
      <<: *app-db
    volumes:
      - dataforge-data:/data
    networks:
      - sandbox
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on: *after-migrate

  publisher:
    <<: *backend-image
    command: python -m worker.publisher_main
    environment:
      <<: *app-db
      DATAFORGE_WAREHOUSE_DSN: postgresql://publisher:${PUBLISHER_PASSWORD}@postgres:5432/dataforge_warehouse
      DATAFORGE_METABASE_URL: http://metabase:3000
      DATAFORGE_METABASE_USER: ${METABASE_ADMIN_EMAIL}
      DATAFORGE_METABASE_PASSWORD: ${METABASE_ADMIN_PASSWORD}
    volumes:
      - dataforge-data:/data:ro
    depends_on:
      <<: *after-migrate
      metabase:
        condition: service_started

  airflow-init:
    build: ./airflow
    image: dataforge-airflow:0.1.0
    environment: *airflow-env
    command: airflow db migrate
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow
    command: airflow api-server
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow
    command: airflow scheduler

  airflow-dag-processor:
    <<: *airflow
    command: airflow dag-processor

networks:
  default:
  sandbox:
    internal: true

volumes:
  postgres-data:
  qdrant-data:
  dataforge-data:
